<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Index</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #e0f7fa, #f5f5f5);
        color: #222;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        padding: 2rem 3rem;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        color: #1f2937;
      }

      p {
        color: #4b5563;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello, World!</h1>
      <p>This is a simple HTML example pageeeee </p>
      <button type="button">Click Me</button>
    </div>
  </body>
</html>
